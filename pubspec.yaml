name: flutter_feed_player
description: >-
  Vertical short-video feed and series episode player for Flutter with
  park/promote preloading. No backend required.
version: 0.1.8
homepage: https://github.com/martcodex/flutter_feed_player
repository: https://github.com/martcodex/flutter_feed_player
issue_tracker: https://github.com/martcodex/flutter_feed_player/issues
topics:
  - video
  - player
  - feed
  - short-video
  - media

screenshots:
  - description: >-
      Vertical short-video feed with a butterfly clip, center play button,
      like and share actions, and a bottom seek bar.
    path: screenshots/feed_player.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: dev.martcodex.flutter_feed_player
        pluginClass: FlutterFeedPlayerPlugin
      ios:
        pluginClass: FlutterFeedPlayerPlugin
