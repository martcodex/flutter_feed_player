name: flutter_feed_player
description: >
  Vertical short-video feed player and series episode player for Flutter.
  Built on video_player with park/promote preloading for TikTok-style feeds
  and binge episode swiping. No backend required — host apps inject playable data.
version: 0.1.1
homepage: https://github.com/martcodex/flutter_feed_player
repository: https://github.com/martcodex/flutter_feed_player
issue_tracker: https://github.com/martcodex/flutter_feed_player/issues
topics:
  - video
  - player
  - feed
  - short-video
  - flutter

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
